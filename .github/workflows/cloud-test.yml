name: Cloud validation and live EP probe
on:
  workflow_dispatch:
  push:
    branches: [codex/xml-poller]
    paths:
      - '.github/workflows/cloud-test.yml'
      - 'poller.py'
      - 'cloud_probe.py'
      - 'Dockerfile'
      - 'compose*.yaml'
      - 'tests/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EP_USER_AGENT: EP-VL-XML-Poller/1.0 (+https://github.com/miron-p/ep-xml-poller)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test application on Linux
        run: python -m unittest discover -s tests -v
      - name: Validate both Compose configurations
        env:
          DOMAIN: example.invalid
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.public.yaml config --quiet
      - name: Build and run the Docker image
        run: |
          docker build -t ep-xml-poller:test .
          docker run --rm ep-xml-poller:test python poller.py status
      - name: Probe listing and three known XML URLs independently
        id: probe
        continue-on-error: true
        run: python cloud_probe.py
      - name: Check collection from inside Docker
        id: collection
        continue-on-error: true
        run: docker run --rm -e EP_USER_AGENT ep-xml-poller:test python poller.py once
      - name: Report network result
        if: always()
        env:
          PROBE_RESULT: ${{ steps.probe.outcome }}
          COLLECTION_RESULT: ${{ steps.collection.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ['GITHUB_STEP_SUMMARY']).open('a').write(
              '\nDocker collection outcome: ' + os.environ['COLLECTION_RESULT'] + '\n')
          if os.environ['PROBE_RESULT'] != 'success' or os.environ['COLLECTION_RESULT'] != 'success':
              raise SystemExit('Cloud build/tests may pass while EP retrieval fails; inspect the live network probe above.')
          PY
